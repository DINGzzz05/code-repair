defaults:
  - single_turn

vllm_mode: "async_server"
multi_turn: true
mask_tool_responses: false

max_prompt_length: 1024  # not strictly enforced
max_completion_length: 7168  # but dr_grpo uses this for normalization

# we must fit an entire group per forward pass (per_device_train_batch_size * num_gpus % num_generations == 0)
num_generations: 8  # group size of GRPO
generation_batch_size: 8
per_device_train_batch_size: 4  # "default" runs have 2 training GPUs 
gradient_accumulation_steps: 4

loss_type: "dr_grpo"

# Curriculum annealing over instance difficulty (easy -> hard).
# Requires run.difficulty="curriculum" and a difficulty.jsonl from measurement.
curriculum:
  enabled: false
  start_bin: null  # auto: highest bin present (easiest) after dynamic binning
  end_bin: null    # auto: lowest bin present (hardest)
  window: 1     # radius of active bins around the annealing center
  tau: 1.0      # softmax sharpness; smaller = sharper transition
  easy_mix_floor: 0.15  # minimum share of easiest-bin data per batch (anti-forgetting)
  seed: 42

# Fine-grained live difficulty loop: every rollout updates the difficulty state
# via a calibrated diff-similarity proxy; bins are re-computed periodically.
live_difficulty:
  enabled: false
  pass_threshold: null       # null = auto-calibrate from calibration_dataset
  calibration_dataset: null  # labeled measurement dataset (with passed + diffs)
  num_bins: 5
  min_bin_size: 0.05
  rebin_every_steps: 200
  score_window: 50           # live pass rate uses the last N proxy scores per instance
  prior_decay_tau: null      # null = auto (total_steps/4); >0 = exp(-step/tau); 0 = never decay
  harness_dir: null          # optional async harness calibration (inbox/outbox subdirs)
  export_every_steps: 500

gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: true
