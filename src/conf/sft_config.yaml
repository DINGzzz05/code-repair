defaults:
  - _self_
  - model: small_qwen
  - sft: default

# Run configuration (parameters not in SFTConfig)
run:
  only_passed: true  # keep only teacher trajectories whose fix passed
  max_passed_per_instance: 4  # if an instance has more passing rollouts, keep only the 4 shortest
  apply_sample_weights: true  # w = num_total_rollouts / num_passed_rollouts; low pass rate -> higher weight
  sample_weight_exponent: 0.5  # w = (N/n)^0.5; 1.0 = full inverse pass rate, lower = softer, <=0 = off
  dataset_name: "ASSERT-KTH/Nano-SFT-SWE-Gym-gemini-2.5-flash"
  push_to_hub: false
  commit_hash: ""  # will be set automatically
  
  wandb_project: "SWE-Gym-SFT"

hydra:
  job:
    chdir: false # Prevents Hydra from changing the working directory
